services:
  postgres:
    image: postgres:16
    container_name: thesis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: thesis
      POSTGRES_USER: thesis
      POSTGRES_PASSWORD: thesis
    ports:
      - "5432:5432"
    volumes: #so data stays persistent upon restart
          - thesis_postgres_data:/var/lib/postgresql/data

volumes:
  thesis_postgres_data:
spring.application.name=phishing-prototype

spring.datasource.url=jdbc:postgresql://localhost:5432/thesis
spring.datasource.username=thesis
spring.datasource.password=thesis

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false

#API Key for Prompt to LLM
gemini.api-key=${GEMINI_API_KEY}
gemini.model=gemini-3.5-flash
gemini.base-url=https://generativelanguage.googleapis.com

#Retry Configurations for the API calls
gemini.retry.max-attempts=4
gemini.retry.initial-delay-ms=1000
gemini.retry.max-delay-ms=8000